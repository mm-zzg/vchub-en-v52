name: ci 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: ~/.cache 
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material 
      - run: pip install mkdocs-minify-plugin
      - run: pip install mkdocs-ezlinks-plugin
      - name: Deploy on-premise documentation to this repository
        env:
          DOCS_BUILD_MODE: on-premise
        run: mkdocs gh-deploy --force
      - name: Deploy SaaS documentation to this repository
        env:
          DOCS_BUILD_MODE: saas
        run: mkdocs gh-deploy --force --remote-branch gh-pages-saas
      - name: Configure SSH access to SaaS repository
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SAAS_DEPLOY_KEY }}
          TARGET_REPOSITORY: ${{ github.repository }}-saas
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "SAAS_DEPLOY_KEY is not configured"
            exit 1
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

          git remote add docs-target \
            "git@github.com:${TARGET_REPOSITORY}.git"
      - name: Deploy SaaS documentation to target repository
        env:
          DOCS_BUILD_MODE: saas
        run: |
          mkdocs gh-deploy \
            --force \
            --remote-name docs-target \
            --remote-branch gh-pages
    